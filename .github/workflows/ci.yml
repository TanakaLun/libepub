name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # GitHub runners ship the Android SDK; android-actions/setup-android@v3
      # now fails because it tries to install the retired "tools" package, so
      # install only what this build needs and let AGP fetch anything missing.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f | head -n 1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --list 2>/dev/null | grep -E '^\s+platforms;android-3[6-9]' | head -10 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" \
            || echo "sdkmanager could not install everything; AGP will download what is missing"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The acceptance book is copyrighted and is not committed, so the
      # real-book tests skip here (by design); synthetic corpora cover the
      # parser, cascade, layout and render paths.
      - name: Unit tests (core + render + app)
        run: >
          ./gradlew :core:test :render:testDebugUnitTest :app:testDebugUnitTest
          --console=plain --stacktrace

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re, sys
          failed_total = 0
          for mod in ("core", "render", "app"):
              tests = skipped = failed = 0
              for path in glob.glob(f"{mod}/build/test-results/*/TEST-*.xml"):
                  xml = open(path, encoding="utf-8", errors="replace").read()
                  m = re.search(r'tests="(\d+)".*?skipped="(\d+)".*?failures="(\d+)" errors="(\d+)"', xml)
                  if m:
                      tests += int(m.group(1))
                      skipped += int(m.group(2))
                      failed += int(m.group(3)) + int(m.group(4))
              print(f"{mod}: {tests} tests, {skipped} skipped, {failed} failed")
              failed_total += failed
          if failed_total:
              sys.exit(1)
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            render/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" \
            || echo "sdkmanager could not install everything; AGP will download what is missing"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK and publishable AARs
        run: >
          ./gradlew :app:assembleDebug :core:assemble :render:assembleRelease
          --console=plain --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
