name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The acceptance book is copyrighted and is not committed, so the
      # real-book tests skip here (by design); synthetic corpora cover the
      # parser, cascade, layout and render paths.
      - name: Unit tests (core + render + app)
        run: >
          ./gradlew :core:test :render:testDebugUnitTest :app:testDebugUnitTest
          --console=plain --stacktrace

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re, os, sys
          for mod in ("core", "render", "app"):
              tests = skipped = failed = 0
              for path in glob.glob(f"{mod}/build/test-results/*/TEST-*.xml"):
                  xml = open(path, encoding="utf-8", errors="replace").read()
                  m = re.search(r'tests="(\d+)".*?skipped="(\d+)".*?failures="(\d+)" errors="(\d+)"', xml)
                  if m:
                      tests += int(m.group(1))
                      skipped += int(m.group(2))
                      failed += int(m.group(3)) + int(m.group(4))
              print(f"{mod}: {tests} tests, {skipped} skipped, {failed} failed")
              if failed:
                  sys.exit(1)
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            render/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK and publishable AARs
        run: >
          ./gradlew :app:assembleDebug :core:assemble :render:assembleRelease
          --console=plain --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
