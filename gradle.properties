# Memory budget tuned for the container (host LMK kills daemons under pressure;
# container has ~2.5GB available + heavy swap use).
org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx512m
org.gradle.workers.max=4
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Machine-specific settings do not belong here (CI and other developers would
# inherit them). In particular, aarch64 containers where Google's aapt2 cannot
# execute should put this in ~/.gradle/gradle.properties instead:
#   android.aapt2FromMavenOverride=/usr/local/bin/aapt2
